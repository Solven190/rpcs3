name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache git submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK & CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}\ndk\29.0.14206865
            ${{ env.ANDROID_SDK_ROOT }}\cmake\3.30.5
          key: ndk-cmake-29.0.14206865-3.30.5

      - name: Install NDK & CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.30.5"

      - name: Export NDK_DIR for FFmpeg build script
        shell: powershell
        run: |
          $ndkPath = "$env:ANDROID_SDK_ROOT\ndk\29.0.14206865" -replace '\\', '/'
          "NDK_DIR=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache MinGW-w64 toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\mingw
          key: mingw-nixman-13.2.0-rt_v11-rev1

      - name: Install MinGW-w64 toolchain (GCC 13.2.0)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev1/x86_64-13.2.0-release-posix-seh-ucrt-rt_v11-rev1.7z"
          $archive = "$env:RUNNER_TEMP\mingw.7z"
          curl.exe -L --fail --retry 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "curl download failed with exit code $LASTEXITCODE" }
          $target = "$env:LOCALAPPDATA\mingw"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive -o"$target" -y
          if (-not (Test-Path "$target\mingw64\bin\gcc.exe")) {
            throw "gcc.exe not found after extraction - archive layout unexpected"
          }

      - name: Add MinGW to PATH
        shell: powershell
        run: |
          "$env:LOCALAPPDATA\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MinGW GCC version
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\mingw\mingw64\bin\gcc.exe" --version

      - name: Disable Windows Defender scanning
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Set-MpPreference -DisableRealtimeMonitoring $true

      # ============================================
      # خطوات Python المحسنة بالكامل
      # ============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify and configure Python
        shell: powershell
        run: |
          # الحصول على مسار Python الفعلي
          $pythonExe = (Get-Command python).Source
          $pythonDir = Split-Path $pythonExe -Parent
          
          Write-Host "========================================"
          Write-Host "Python executable: $pythonExe"
          Write-Host "Python directory: $pythonDir"
          Write-Host "========================================"
          
          # التحقق من أن Python يعمل
          & $pythonExe --version
          & $pythonExe -c "import sys; print(f'Sys executable: {sys.executable}')"
          
          # تعيين المتغيرات البيئية بشكل صريح
          Add-Content -Path $env:GITHUB_ENV -Value "Python3_ROOT_DIR=$pythonDir"
          Add-Content -Path $env:GITHUB_ENV -Value "Python_ROOT_DIR=$pythonDir"
          Add-Content -Path $env:GITHUB_ENV -Value "Python3_EXECUTABLE=$pythonExe"
          Add-Content -Path $env:GITHUB_ENV -Value "Python_EXECUTABLE=$pythonExe"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXECUTABLE=$pythonExe"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON3_EXECUTABLE=$pythonExe"
          
          # إضافة Python إلى PATH في بداية المسار
          Add-Content -Path $env:GITHUB_PATH -Value $pythonDir
          Add-Content -Path $env:GITHUB_PATH -Value "$pythonDir\Scripts"
          
          # إنشاء ملف تكوين CMake لإجبار Python
          $cmakePythonConfig = @"
          # Force Python detection for LLVM
          set(Python3_EXECUTABLE "$pythonExe" CACHE FILEPATH "Python executable" FORCE)
          set(Python_EXECUTABLE "$pythonExe" CACHE FILEPATH "Python executable" FORCE)
          set(Python3_ROOT_DIR "$pythonDir" CACHE PATH "Python root" FORCE)
          set(Python_ROOT_DIR "$pythonDir" CACHE PATH "Python root" FORCE)
          set(Python3_FOUND TRUE CACHE BOOL "Python found" FORCE)
          set(Python_FOUND TRUE CACHE BOOL "Python found" FORCE)
          set(Python3_Interpreter_FOUND TRUE CACHE BOOL "Python interpreter found" FORCE)
          "@
          
          $cmakeConfigPath = "${{ github.workspace }}\python-config.cmake"
          Set-Content -Path $cmakeConfigPath -Value $cmakePythonConfig -Encoding ascii
          Write-Host "Created CMake config: $cmakeConfigPath"
          
          # إضافة متغير لتوجيه CMake لاستخدام هذا الملف
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_TOOLCHAIN_FILE=$cmakeConfigPath"

      - name: Set Python in environment for Gradle
        shell: powershell
        run: |
          $pythonExe = (Get-Command python).Source
          $pythonDir = Split-Path $pythonExe -Parent
          
          # إنشاء ملف properties لـ Gradle
          @"
          systemProp.python.executable=$pythonExe
          systemProp.python.root.dir=$pythonDir
          systemProp.Python3_EXECUTABLE=$pythonExe
          systemProp.Python_ROOT_DIR=$pythonDir
          "@ | Out-File -FilePath "${{ github.workspace }}\gradle.properties" -Append -Encoding ascii
          
          Write-Host "Gradle properties updated with Python path"

      - name: Configure local.properties
        shell: powershell
        run: |
          $sdkPath = $env:ANDROID_SDK_ROOT -replace '\\', '/'
          "sdk.dir=$sdkPath" | Out-File -Encoding ascii local.properties

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('.ci/build-windows-clang.sh') }}

      - name: Cache native core build
        uses: actions/cache@v4
        with:
          path: app/build/emucorec-core-build
          key: core-build-${{ hashFiles('android/CMakeLists.txt', 'android/configure-core.cmd', 'rpcs3/**') }}
          restore-keys: |
            core-build-

      # Ephemeral key, regenerated on every run — build verification only, not for distribution.
      - name: Generate signing key
        shell: powershell
        run: |
          $keytool = "$env:JAVA_HOME\bin\keytool.exe"
          & $keytool -genkeypair -v `
            -keystore app/test-release.keystore `
            -alias testkey -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass android -keypass android `
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Apply release signing config
        shell: powershell
        run: |
          $block = @"

          android {
              signingConfigs {
                  create("testRelease") {
                      storeFile = file("test-release.keystore")
                      storePassword = "android"
                      keyAlias = "testkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("testRelease")
                  }
              }
          }
          "@
          Add-Content -Path "app/build.gradle.kts" -Value $block

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # ============================================
      # إصلاح CMakeLists.txt لـ LLVM مؤقتاً
      # ============================================
      - name: Patch LLVM CMakeLists.txt for Python
        shell: powershell
        run: |
          $llvmCmakePath = "${{ github.workspace }}\3rdparty\llvm\llvm\llvm\CMakeLists.txt"
          if (Test-Path $llvmCmakePath) {
            $content = Get-Content $llvmCmakePath -Raw
            # إضافة متغيرات Python قبل find_package
            $pythonOverride = @"
          # Force Python detection - added by CI
          if(NOT DEFINED Python3_EXECUTABLE)
              set(Python3_EXECUTABLE "$env:Python3_EXECUTABLE" CACHE FILEPATH "Python executable")
          endif()
          if(NOT DEFINED Python_EXECUTABLE)
              set(Python_EXECUTABLE "$env:Python_EXECUTABLE" CACHE FILEPATH "Python executable")
          endif()
          if(NOT DEFINED Python3_ROOT_DIR)
              set(Python3_ROOT_DIR "$env:Python3_ROOT_DIR" CACHE PATH "Python root")
          endif()
          if(NOT DEFINED Python_ROOT_DIR)
              set(Python_ROOT_DIR "$env:Python_ROOT_DIR" CACHE PATH "Python root")
          endif()
          set(Python3_FOUND TRUE)
          set(Python_FOUND TRUE)
          "@
            
            # البحث عن find_package(Python3) وإضافة التصحيح قبله
            if ($content -match "find_package\(Python3") {
              $content = $content -replace "find_package\(Python3", "$pythonOverride`nfind_package(Python3"
              Set-Content -Path $llvmCmakePath -Value $content -Encoding ascii
              Write-Host "Patched LLVM CMakeLists.txt for Python"
            } else {
              Write-Host "Could not find find_package(Python3) in LLVM CMakeLists.txt"
            }
          } else {
            Write-Host "LLVM CMakeLists.txt not found at: $llvmCmakePath"
          }

      - name: Assemble release
        shell: powershell
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          # تمرير جميع متغيرات Python
          Python3_ROOT_DIR: ${{ env.Python3_ROOT_DIR }}
          Python_ROOT_DIR: ${{ env.Python_ROOT_DIR }}
          Python3_EXECUTABLE: ${{ env.Python3_EXECUTABLE }}
          Python_EXECUTABLE: ${{ env.Python_EXECUTABLE }}
          PYTHON_EXECUTABLE: ${{ env.PYTHON_EXECUTABLE }}
        run: |
          # تأكيد أن Python يعمل قبل البناء
          Write-Host "========================================"
          Write-Host "Python environment check:"
          python --version
          python -c "import sys; print(f'Python executable: {sys.executable}')"
          python -c "import site; print(f'Python site packages: {site.getsitepackages()}')"
          Write-Host "========================================"
          
          # تشغيل البناء
          .\gradlew.bat :app:assembleRelease --stacktrace --parallel --build-cache -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuCoreC-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Dump build logs (debug)
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Checking for build logs..."
          
          # البحث عن config.log
          $log = Get-ChildItem -Path . -Recurse -Filter "config.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) {
            Write-Host "Found config.log: $($log.FullName)"
            Get-Content $log.FullName -Tail 150
          }
          
          # البحث عن CMakeOutput.log
          $cmakeLog = Get-ChildItem -Path . -Recurse -Filter "CMakeOutput.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cmakeLog) {
            Write-Host "Found CMakeOutput.log: $($cmakeLog.FullName)"
            Get-Content $cmakeLog.FullName -Tail 100
          }
          
          # البحث عن CMakeError.log
          $cmakeError = Get-ChildItem -Path . -Recurse -Filter "CMakeError.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cmakeError) {
            Write-Host "Found CMakeError.log: $($cmakeError.FullName)"
            Get-Content $cmakeError.FullName -Tail 100
          }
          
          Write-Host "========================================"

      - name: Save build environment info
        if: always()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Build environment information:"
          Write-Host "Python location: $env:pythonLocation"
          Write-Host "Python3_ROOT_DIR: $env:Python3_ROOT_DIR"
          Write-Host "Python_EXECUTABLE: $env:Python_EXECUTABLE"
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "ANDROID_SDK_ROOT: $env:ANDROID_SDK_ROOT"
          Write-Host "========================================"