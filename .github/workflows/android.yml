name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.30.5
  MINGW_TAG: 13.2.0-rt_v11-rev1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache git submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ runner.os }}
          restore-keys: |
            submodules-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache SDK build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}\platforms
            ${{ env.ANDROID_SDK_ROOT }}\build-tools
            ${{ env.ANDROID_SDK_ROOT }}\platform-tools
          key: sdk-tools-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle.properties') }}
          restore-keys: |
            sdk-tools-${{ runner.os }}-

      - name: Cache NDK and CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}\ndk\${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}\cmake\${{ env.CMAKE_VERSION }}
          key: ndk-cmake-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}
          restore-keys: |
            ndk-cmake-${{ runner.os }}-${{ env.NDK_VERSION }}-
            ndk-cmake-${{ runner.os }}-

      - name: Install NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          sdkmanager --install "ndk;%NDK_VERSION%"
          sdkmanager --install "cmake;%CMAKE_VERSION%"

      - name: Export NDK_DIR
        shell: powershell
        run: |
          $ndkPath = "$env:ANDROID_SDK_ROOT\ndk\$env:NDK_VERSION" -replace '\\', '/'
          "NDK_DIR=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache MinGW toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\mingw
          key: mingw-${{ runner.os }}-${{ env.MINGW_TAG }}
          restore-keys: |
            mingw-${{ runner.os }}-

      - name: Install MinGW toolchain
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/$env:MINGW_TAG/x86_64-13.2.0-release-posix-seh-ucrt-rt_v11-rev1.7z"
          $archive = "$env:RUNNER_TEMP\mingw.7z"
          curl.exe -L --fail --retry 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "MinGW download failed (exit code $LASTEXITCODE)" }

          $target = "$env:LOCALAPPDATA\mingw"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive -o"$target" -y
          if (-not (Test-Path "$target\mingw64\bin\gcc.exe")) {
            throw "gcc.exe not found after extraction - archive layout unexpected"
          }

      - name: Add MinGW to PATH
        shell: powershell
        run: |
          "$env:LOCALAPPDATA\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Disable Windows Defender scanning
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Point CMake to the Python interpreter
        shell: powershell
        run: |
          $pythonPath = (Get-Command python).Source
          $pythonDir = Split-Path $pythonPath -Parent

          "Python3_ROOT_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Python_ROOT_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $targetDir = "C:\Users\runneradmin\AppData\Local\Programs\Python"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          $linkPath = "$targetDir\Python312"
          if (Test-Path $linkPath) {
            Remove-Item $linkPath -Recurse -Force
          }
          cmd /c mklink /J "$linkPath" "$pythonDir"

      - name: Configure local.properties
        shell: powershell
        run: |
          $sdkPath = $env:ANDROID_SDK_ROOT -replace '\\', '/'
          "sdk.dir=$sdkPath" | Out-File -Encoding ascii local.properties

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg-android
          key: ffmpeg-android-${{ runner.os }}-${{ hashFiles('.ci/build-windows-clang.sh') }}-${{ hashFiles('app/src/main/cpp/ffmpeg/**') }}
          restore-keys: |
            ffmpeg-android-${{ runner.os }}-
            ffmpeg-android-

      - name: Cache native build tree
        id: cache-native
        uses: actions/cache@v4
        with:
          path: app/build/emucorec-core-build
          key: core-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            core-build-${{ runner.os }}-
            core-build-

      - name: Cache Gradle wrapper
        id: cache-gradle-wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Cache Gradle dependencies
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/build-cache-1
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-
            gradle-deps-

      # Regenerated every run for build verification only - never used for real signing.
      - name: Generate signing key
        shell: powershell
        run: |
          $keytool = "$env:JAVA_HOME\bin\keytool.exe"
          & $keytool -genkeypair -v `
            -keystore app/test-release.keystore `
            -alias testkey -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass android -keypass android `
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Apply release signing config
        shell: powershell
        run: |
          $block = @"

          android {
              signingConfigs {
                  create("testRelease") {
                      storeFile = file("test-release.keystore")
                      storePassword = "android"
                      keyAlias = "testkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("testRelease")
                  }
              }
          }
          "@
          Add-Content -Path "app/build.gradle.kts" -Value $block

      - name: Setup Gradle properties for caching
        shell: powershell
        run: |
          $props = @"
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          "@
          $props | Out-File -FilePath "gradle.properties" -Encoding utf8 -Append

      - name: Build APK
        shell: powershell
        env:
          Python3_ROOT_DIR: ${{ env.Python3_ROOT_DIR }}
          Python_ROOT_DIR: ${{ env.Python_ROOT_DIR }}
        run: |
          .\gradlew.bat :app:assembleRelease --stacktrace --parallel --build-cache --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuCoreC-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Dump FFmpeg config.log
        if: always()
        shell: powershell
        run: |
          $log = Get-ChildItem -Path . -Recurse -Filter "config.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) {
            Get-Content $log.FullName -Tail 150
          } else {
            Write-Host "No config.log found in workspace."
          }