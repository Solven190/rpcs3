name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK & CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}\ndk\29.0.14206865
            ${{ env.ANDROID_SDK_ROOT }}\cmake\3.30.5
          key: ndk-cmake-${{ runner.os }}-29.0.14206865-3.30.5

      - name: Install Dependencies
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.30.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Configure Python
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          $pythonDir = Split-Path $python -Parent
          $targetDir = "C:\Users\runneradmin\AppData\Local\Programs\Python"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          $linkPath = "$targetDir\Python312"
          if (Test-Path $linkPath) { Remove-Item $linkPath -Recurse -Force }
          cmd /c mklink /J "$linkPath" "$pythonDir"
          "Python3_ROOT_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Python_ROOT_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ runner.os }}
          max-size: 2G

      - name: Configure NDK
        shell: powershell
        run: |
          $ndk = "$env:ANDROID_SDK_ROOT\ndk\29.0.14206865" -replace '\\', '/'
          "NDK_DIR=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Local Properties
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT -replace '\\', '/'
          "sdk.dir=$sdk" | Out-File -Encoding ascii local.properties

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            app/build/ffmpeg-android
            app/build/emucorec-core-build
            app/build/emucorec-core
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Generate Signing Key
        shell: powershell
        run: |
          & "$env:JAVA_HOME\bin\keytool.exe" -genkeypair -v `
            -keystore app/test-release.keystore `
            -alias testkey `
            -keyalg RSA `
            -keysize 2048 `
            -validity 10000 `
            -storepass android `
            -keypass android `
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Configure Signing
        shell: powershell
        run: |
          @"
          android {
              signingConfigs {
                  create("testRelease") {
                      storeFile = file("test-release.keystore")
                      storePassword = "android"
                      keyAlias = "testkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("testRelease")
                  }
              }
          }
          "@ | Out-File -FilePath "app/build.gradle.kts" -Append -Encoding ascii

      - name: Assemble Release
        shell: powershell
        run: |
          .\gradlew.bat :app:assembleRelease `
            --parallel `
            --build-cache `
            -Dorg.gradle.jvmargs=-Xmx4g `
            -Dorg.gradle.parallel=true `
            -Dorg.gradle.caching=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuCoreC-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Debug Build Logs
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter "config.log" | Select-Object -First 1 | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Get-Content $_.FullName -Tail 100
          }
          Get-ChildItem -Recurse -Filter "CMakeError.log" | Select-Object -First 1 | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Get-Content $_.FullName -Tail 100
          }