name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache git submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK & CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}\ndk\29.0.14206865
            ${{ env.ANDROID_SDK_ROOT }}\cmake\3.30.5
          key: ndk-cmake-29.0.14206865-3.30.5

      - name: Install NDK & CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.30.5"

      - name: Cache MinGW-w64 toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\mingw
          key: mingw-13.2.0

      - name: Install MinGW-w64 toolchain
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install mingw -y --version=13.2.0 --force
          $target = "$env:LOCALAPPDATA\mingw"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $src = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64"
          if (Test-Path $src) {
            Copy-Item -Recurse -Force $src "$target\mingw64"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure local.properties
        shell: powershell
        run: |
          "sdk.dir=$env:ANDROID_SDK_ROOT" | Out-File -Encoding ascii local.properties

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('android/build-ffmpeg.sh') }}

      - name: Cache native core build
        uses: actions/cache@v4
        with:
          path: app/build/emucorec-core-build
          key: core-build-${{ hashFiles('android/CMakeLists.txt', 'android/configure-core.cmd', 'rpcs3/**') }}
          restore-keys: |
            core-build-

      # Ephemeral key, regenerated on every run — build verification only, not for distribution.
      - name: Generate signing key
        shell: powershell
        run: |
          $keytool = "$env:JAVA_HOME\bin\keytool.exe"
          & $keytool -genkeypair -v `
            -keystore app/test-release.keystore `
            -alias testkey -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass android -keypass android `
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Apply release signing config
        shell: powershell
        run: |
          $block = @"

          android {
              signingConfigs {
                  create("testRelease") {
                      storeFile = file("test-release.keystore")
                      storePassword = "android"
                      keyAlias = "testkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("testRelease")
                  }
              }
          }
          "@
          Add-Content -Path "app/build.gradle.kts" -Value $block

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Assemble release
        shell: powershell
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          .\gradlew.bat :app:assembleRelease --stacktrace --parallel --build-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuCoreC-release-apk
          path: app/build/outputs/apk/release/*.apk