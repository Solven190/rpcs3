name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.30.5"

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ runner.os }}
          max-size: 2G

      - name: Configure NDK
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Configure Local Properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            app/build/ffmpeg-android
            app/build/emucorec-core-build
            app/build/emucorec-core
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Generate Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore app/test-release.keystore \
            -alias testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Configure Signing
        run: |
          cat >> app/build.gradle.kts << 'EOF'

          android {
              signingConfigs {
                  create("testRelease") {
                      storeFile = file("test-release.keystore")
                      storePassword = "android"
                      keyAlias = "testkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("testRelease")
                  }
              }
          }
          EOF

      - name: Assemble Release
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          ./gradlew :app:assembleRelease \
            --parallel \
            --build-cache \
            -Dorg.gradle.jvmargs=-Xmx4g \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuCoreC-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Debug Build Logs
        if: failure()
        run: |
          find . -name "config.log" -exec tail -n 100 {} \;
          find . -name "CMakeError.log" -exec tail -n 100 {} \;